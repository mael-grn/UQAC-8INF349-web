
services:
  postgres:
    image: postgres:12
    restart: always
    environment:
      POSTGRES_DB: inf349
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:5
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: inf349
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inf349
      DB_USER: user
      DB_PASSWORD: pass
    depends_on:
      - postgres
      - redis

volumes:
  pgdata:
